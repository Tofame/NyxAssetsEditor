# Master custom flag definitions for things.json format.
# All DAT properties and JSON properties schema-defined with human readable labels and groups.

# --- Text & Metadata ---
[flag.name]
label = "Name"
type = "string"
group = "metadata"

[flag.article]
label = "Article"
type = "string"
group = "metadata"

[flag.description]
label = "Description"
type = "string"
group = "metadata"

[groups.metadata]
label = "Metadata"
order = 1

# --- Classification / Types ---
[flag.isContainer]
label = "Container"
type = "bool"
group = "classification"

[flag.isFluidContainer]
label = "Fluid Container"
type = "bool"
group = "classification"

[flag.isFluid]
label = "Fluid"
type = "bool"
group = "classification"

[groups.classification]
label = "Classification"
order = 2

