# Master custom flag definitions for things.json format.
# Standard DAT properties and TFS items.xml attributes defined with accurate types and groups.
# All default schema flags are locked by default. Edit this file or create a local flags_custom_override.toml to change.

# --- Text & Metadata ---
[flag.name]
label = "Name"
type = "string"
group = "metadata"
locked = true

[flag.article]
label = "Article"
type = "string"
group = "metadata"
locked = true

[flag.description]
label = "Description"
type = "string"
group = "metadata"
locked = true

[flag.plural]
label = "Plural Name"
type = "string"
group = "metadata"
locked = true

[flag.runespellname]
label = "Rune Spell Name"
type = "string"
group = "metadata"
locked = true

[groups.metadata]
label = "Metadata"
order = 1

