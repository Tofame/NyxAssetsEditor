# Master custom flag definitions for things.json format.
# Standard DAT properties and TFS items.xml attributes defined with accurate types and groups.
# All default schema flags are locked by default. Edit this file or create a local flags_custom_override.toml to change.

# --- Text & Metadata ---
[flag.name]
label = "Name"
description = "Item or creature display name shown on look and inventory."
type = "string"
group = "metadata"
locked = true

[flag.article]
label = "Article"
description = "Indefinite article prefix (a, an) used before item name."
type = "string"
group = "metadata"
locked = true

[flag.description]
label = "Description"
description = "Detailed text description shown when inspecting the item."
type = "string"
group = "metadata"
locked = true

[flag.plural]
label = "Plural Name"
description = "Plural form of the item name when stacked or counted."
type = "string"
group = "metadata"
locked = true

[flag.runespellname]
label = "Rune Spell Name"
description = "Name of the spell invoked when using this rune."
type = "string"
group = "metadata"
locked = true

[groups.metadata]
label = "Metadata"
order = 1

# --- Classification & Equipment Types ---
[flag.isContainer]
label = "Container"
description = "Allows item to store other items inside container window."
type = "bool"
group = "classification"
locked = true

[flag.stackable]
